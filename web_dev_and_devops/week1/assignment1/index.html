<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleven Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h3>llElevenLabs</h3>
    </header>
    <form>
        <p class="acc">Create an account</p>

        <div class="google">
            <img src="image.png" alt="google">
            <p>Sign up with google</p>
        </div>

        <div class="box">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="email">
        </div>

        <div class="box">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="password">
        </div>

        <button>Sign Up</button>

        <p class="signin">Already registered? <u>Sign in</u></p>
    </form>
    <footer>

        <p>By continuing, you agree to our <u>Terms of service</u> and <u>Privacy Policy</u></p>

    </footer>


    
</body>
</html>
